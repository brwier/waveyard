name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ruff, mypy, pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync the core and dev extras
        run: uv sync --extra core --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src

      - name: Unit tests
        run: uv run pytest -m unit
